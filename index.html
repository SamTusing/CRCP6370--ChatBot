<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Chatbot</title>

<!-- Cowboy font -->
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background: linear-gradient(#f6efe3, #e8d6b3);
  }

  .chat-container {
    max-width: 600px;
    margin: 2rem auto;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    height: 80vh;
  }

  #chat {
    flex: 1;
    padding: 1rem;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .message {
    padding: 0.6rem 1rem;
    border-radius: 20px;
    max-width: 75%;
    animation: fadeIn 0.3s ease-in;
  }

  .user {
    background: #007bff;
    color: #fff;
    align-self: flex-end;
  }

  .bot {
    background: #f3e3c3;
    color: #000;
    align-self: flex-start;
    font-family: 'Special Elite', monospace;
    border: 1px solid #d4b483;
  }

  .typing {
    font-style: italic;
    opacity: 0.7;
  }

  .input-container {
    display: flex;
    padding: 1rem;
    border-top: 1px solid #ccc;
  }

  input {
    flex: 1;
    padding: 0.7rem 1rem;
    border-radius: 20px;
    border: 1px solid #ccc;
    margin-right: 0.5rem;
  }

  button {
    padding: 0.7rem 1rem;
    border-radius: 20px;
    border: none;
    background: #7b4a12;
    color: #fff;
    cursor: pointer;
  }

  button:hover {
    background: #5c360d;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

<body>

<div class="chat-container">
  <div id="chat"></div>

  <!-- Typing indicator -->
  <div id="typing" class="message bot typing" style="display:none;">
    🤠 Cowboy is thinkin’…
  </div>

  <div class="input-container">
    <input type="text" id="message" placeholder="Type a message..." />
    <button onclick="sendMessage()">Spit it out</button>
  </div>
</div>

<script>
const chatDiv = document.getElementById('chat');
const input = document.getElementById('message');
const typing = document.getElementById('typing');

async function sendMessage() {
  const msg = input.value.trim();
  if (!msg) return;

  addMessage(msg, 'user');
  input.value = '';

  typing.style.display = "block";

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg })
    });

    const data = await res.json();
    typing.style.display = "none";
    addMessage(data.reply, 'bot');
  } catch (err) {
    typing.style.display = "none";
    addMessage("Dang it. Something broke.", 'bot');
  }
}

function addMessage(text, sender) {
  const elem = document.createElement('div');
  elem.className = 'message ' + sender;
  elem.textContent = text;
  chatDiv.appendChild(elem);
  chatDiv.scrollTop = chatDiv.scrollHeight;
}

input.addEventListener("keypress", function(e) {
  if (e.key === "Enter") sendMessage();
});
</script>

</body>
</html>
