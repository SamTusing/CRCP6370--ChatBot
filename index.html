<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sassy Cowboy Chatbot</title>

<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

<style>
  /* 🌅 BACKGROUND */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  height: 100vh;
  overflow: hidden;
  background: linear-gradient(
    to top,
    #e6c89c 0%,     /* desert sand */
    #e6c89c 35%,    /* foreground stays solid */
    #f1a66a 36%,    /* horizon start */
    #e87c5d 55%,    /* sunset orange */
    #c65b7c 75%,    /* dusty pink */
    #6a4c93 100%    /* purple dusk sky */
  );
}


  @keyframes sunset {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* 🌵 CACTI */
.cactus {
  position: fixed;
  font-size: 160px;        /* bigger */
  opacity: 0.28;           /* more visible */
  filter: saturate(1.2);  /* richer color */
  animation: sway 10s ease-in-out infinite;
  pointer-events: none;
  z-index: 0;
}


  .cactus.left { bottom: 20px; left: 20px; }
  .cactus.right { bottom: 40px; right: 30px; animation-delay: 2s; }

  @keyframes sway {
    0% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
    100% { transform: rotate(-5deg); }
  }

  /* 🌬️ DUST */
.dust {
  position: fixed;
  width: 6px;
  height: 6px;
  background: rgba(161, 119, 74, 0.837);
  border-radius: 50%;
  filter: blur(0.5px);
  animation: fall linear infinite;
  pointer-events: none;
  z-index: 0;
}


  @keyframes fall {
    to { transform: translateY(110vh); opacity: 0; }
  }

  /* 💬 CHAT CONTAINER */
  .chat-container {
    max-width: 600px;
    height: 80vh;
    margin: 2rem auto;
    background: rgba(255,255,255,0.9);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    z-index: 1;
    position: relative;
  }

  #chat {
    flex: 1;
    padding: 1rem;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  /* 💬 CHAT BUBBLES */
  .message {
    max-width: 75%;
    padding: 0.7rem 1rem;
    border-radius: 20px;
    line-height: 1.4;
    animation: fadeIn 0.2s ease-in;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .user {
    background: #075a39;
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 6px;
  }

  .bot {
    background: #f3e3c3;
    color: #5a3e2b;
    align-self: flex-start;
    border-bottom-left-radius: 6px;
    font-family: 'Special Elite', monospace;
    border: 1px solid #d4b483;
  }

  /* ⌨️ INPUT */
  .input-container {
    display: flex;
    padding: 1rem;
    border-top: 1px solid #ddd;
    gap: 0.5rem;
  }

  input {
    flex: 1;
    padding: 0.75rem 1rem;
    border-radius: 999px;
    border: 1px solid #ccc;
    font-size: 1rem;
  }

  button {
    padding: 0.75rem 1.2rem;
    border-radius: 999px;
    border: none;
    background:  #075a39;
    color: white;
    cursor: pointer;
    font-size: 1rem;
  }

  button:hover {
    background:  #075a39;
  }

  /* 🔫 BULLET HOLES */
  .bullet-hole {
    position: fixed;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: radial-gradient(circle, #000 30%, #444 60%, transparent 70%);
    z-index: 2;
    pointer-events: none;
  }

  .shake {
    animation: shake 0.2s;
  }

  @keyframes shake {
    0% { transform: translate(0); }
    25% { transform: translate(-3px, 2px); }
    50% { transform: translate(3px, -2px); }
    75% { transform: translate(-2px, 2px); }
    100% { transform: translate(0); }
  }
</style>
</head>

<body>

<div class="cactus left">🌵</div>
<div class="cactus right">🌵</div>

<div class="chat-container">
  <div id="chat"></div>
  <div class="input-container">
    <input id="input" placeholder="Say somethin’..." />
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  const chat = document.getElementById("chat");

  function addMessage(text, sender) {
    const div = document.createElement("div");
    div.className = "message " + sender;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  /* 🌬️ DUST */
setInterval(() => {
  const d = document.createElement("div");
  d.className = "dust";
  d.style.left = Math.random() * window.innerWidth + "px";
  d.style.top = "-10px";
  d.style.animationDuration = 6 + Math.random() * 8 + "s";
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 15000);
}, 350);


  /* 🔫 SHOOT */
  function shoot() {
    const h = document.createElement("div");
    h.className = "bullet-hole";
    h.style.left = Math.random() * window.innerWidth + "px";
    h.style.top = Math.random() * window.innerHeight + "px";
    document.body.appendChild(h);
    document.body.classList.add("shake");
    setTimeout(() => document.body.classList.remove("shake"), 200);
  }

  /* 🤠 COWBOY LOGIC */
  function reply(text) {
    if (/hello|hi/i.test(text)) return "Howdy.";
    if (/why|how|what/i.test(text)) {
      shoot();
      return "Careful now… you’re pushin’ it.";
    }
    return "Reckon so.";
  }

  function sendMessage() {
    const input = document.getElementById("input");
    if (!input.value.trim()) return;
    addMessage(input.value, "user");
    const msg = input.value;
    input.value = "";

    setTimeout(() => addMessage(reply(msg), "bot"), 500);
  }

  document.getElementById("input").addEventListener("keypress", e => {
    if (e.key === "Enter") sendMessage();
  });
</script>

</body>
</html>
