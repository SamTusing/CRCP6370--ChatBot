<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Cowboy Chatbot</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  font-family: 'Special Elite', monospace;
  height: 100vh;
  overflow: hidden;
  background: linear-gradient(
    to top,
    #e6c89c 0%,
    #e6c89c 35%,
    #f1a66a 36%,
    #e87c5d 55%,
    #c65b7c 75%,
    #6a4c93 100%
  );
}

/* Chat container */
.chat-container {
  position: relative;
  z-index: 10;
  max-width: 600px;
  margin: 2rem auto;
  background: rgba(243, 227, 195, 0.95);
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  display: flex;
  flex-direction: column;
  height: 80vh;
}

#chat {
  flex: 1;
  padding: 1rem;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}

.input-container {
  display: flex;
  padding: 1rem;
  border-top: 1px solid #ccc;
}

input {
  flex: 1;
  padding: 0.7rem 1rem;
  border-radius: 20px;
  border: 1px solid #ccc;
  margin-right: 0.5rem;
}

button {
  padding: 0.7rem 1rem;
  border-radius: 20px;
  border: none;
  background: #0a502a;
  color: #fff;
  cursor: pointer;
}
button:hover { background: #07401b; }

/* Message containers and bubbles */
.message-container {
  display: flex;
  flex-direction: column;
  margin-bottom: 0.6rem;
  width: 100%;
}

.message-container.user {
  align-items: flex-end; /* push user bubble right */
}

.message-container.Gunslinger,
.message-container.Jellybean {
  align-items: flex-start; /* cowboys left */
}

.message {
  display: inline-block;      /* bubble wraps text */
  max-width: 70%;
  padding: 0.8rem 1.2rem;
  border-radius: 20px;
  line-height: 1.4;
  word-wrap: break-word;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

/* Bubble colors */
.message.user { background: #15683a; color: #fff; }
.message.Gunslinger { background: #774638; color: #fff; }
.message.Jellybean { background: #c77b28; color: #fff; }

.message-name {
  font-weight: bold;
  margin-bottom: 2px;
}



@keyframes fadeIn {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}

canvas { position: absolute; top: 0; left: 0; z-index: 5; }

/* Desert Elements */
.cactus { position: fixed; font-size: 120px; opacity: 0.4; animation: sway 10s ease-in-out infinite; pointer-events: none; z-index: 0; }
.cactus.left { bottom: 20px; left: 20px; }
.cactus.right { bottom: 40px; right: 30px; animation-delay: 2s; }
@keyframes sway { 0% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } 100% { transform: rotate(-5deg); } }

.dust { position: fixed; width: 4px; height: 4px; background: rgba(255,255,255,0.3); border-radius: 50%; animation: fall linear infinite; pointer-events: none; z-index: 0; }
@keyframes fall { to { transform: translateY(110vh); opacity: 0; } }

@keyframes shake { 
  0% { transform: translate(0px, 0px) rotate(0deg); }
  10% { transform: translate(-5px, 2px) rotate(-1deg); }
  20% { transform: translate(4px, -3px) rotate(1deg); }
  30% { transform: translate(-4px, 3px) rotate(-1deg); }
  40% { transform: translate(3px, -2px) rotate(1deg); }
  50% { transform: translate(-3px, 2px) rotate(-1deg); }
  60% { transform: translate(2px, -1px) rotate(1deg); }
  70% { transform: translate(-2px, 1px) rotate(-1deg); }
  80% { transform: translate(1px, 0px) rotate(0deg); }
  90% { transform: translate(-1px, 0px) rotate(0deg); }
  100% { transform: translate(0px, 0px) rotate(0deg); }
}
.shake { animation: shake 0.4s ease-in-out; }
</style>
</head>
<body>

<canvas id="bulletCanvas"></canvas>
<div class="cactus left">🌵</div>
<div class="cactus right">🌵</div>

<div class="chat-container">
  <div id="chat"></div>
  <div class="input-container">
    <input type="text" id="message" placeholder="Type a message..." />
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
const chatDiv = document.getElementById('chat');
const input = document.getElementById('message');
const chatContainer = document.querySelector('.chat-container');
const canvas = document.getElementById("bulletCanvas");
const ctx = canvas.getContext("2d");

// Resize canvas
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Add chat message
function addMessage(text, sender) {
  const container = document.createElement('div');
  container.className = 'message-container';

  if(sender === 'You') container.classList.add('user');
  else if(sender === 'Gunslinger') container.classList.add('Gunslinger');
  else if(sender === 'Jellybean') container.classList.add('Jellybean');

  const nameElem = document.createElement('div');
  nameElem.className = 'message-name';
  nameElem.textContent = sender;

  const msgElem = document.createElement('div');
  msgElem.className = 'message';
  if(sender === 'You') msgElem.classList.add('user');
  else if(sender === 'Gunslinger') msgElem.classList.add('Gunslinger');
  else if(sender === 'Jellybean') msgElem.classList.add('Jellybean');

  msgElem.textContent = text;

  container.appendChild(nameElem);
  container.appendChild(msgElem);
  chatDiv.appendChild(container);
  chatDiv.scrollTop = chatDiv.scrollHeight;
}

// Send message
async function sendMessage() {
  const msg = input.value.trim();
  if (!msg) return;
  addMessage(msg, 'You');
  input.value = '';

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg })
    });
    const data = await res.json();
    if (data.replies) {
      data.replies.forEach(r => addMessage(r.text, r.name));
    }
  } catch (err) {
    addMessage("Error contacting AI.", 'bot');
  }
}

// Bullet click & shake
function shootBullet(x, y) {
  const bullet = { x, y, radius: 5, alpha: 1 };
  chatContainer.classList.add('shake');
  setTimeout(() => chatContainer.classList.remove('shake'), 400);

  const interval = setInterval(() => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    bullet.radius += 2;
    bullet.alpha -= 0.05;
    ctx.fillStyle = `rgba(0,0,0,${bullet.alpha})`;
    ctx.beginPath();
    ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI*2);
    ctx.fill();
    if (bullet.alpha <= 0) { clearInterval(interval); ctx.clearRect(0,0,canvas.width,canvas.height); }
  },16);
}

canvas.addEventListener("click", (e) => shootBullet(e.clientX, e.clientY));
input.addEventListener("keypress", (e) => { if(e.key === "Enter") sendMessage(); });

// Dust
for(let i=0;i<50;i++){
  const d = document.createElement("div");
  d.className = "dust";
  d.style.left = Math.random()*window.innerWidth+"px";
  d.style.top = Math.random()*window.innerHeight+"px";
  d.style.animationDuration = 5 + Math.random()*5+"s";
  d.style.width = 2+Math.random()*3+"px";
  d.style.height = 2+Math.random()*3+"px";
  document.body.appendChild(d);
}
</script>

</body>
</html>
